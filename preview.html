<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>preview</title>
<style>html,body{margin:0;background:#dfe5ec;overflow:hidden}iframe{position:absolute;left:0;top:0;border:0;display:block}</style>
</head>
<body>
<iframe id="f" aria-hidden="true" tabindex="-1" scrolling="no" title="preview"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var w = q.get('w') || '1920', h = q.get('h') || '3600', p = q.get('p') || '';
  var f = document.getElementById('f');
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.src = '/bnml-skku-website/' + p + '?cb=' + Date.now();
</script>
</body>
</html>
