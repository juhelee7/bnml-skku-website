<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Mobile preview</title>
<style>
  html,body{margin:0;padding:0;background:#ddd}
  #f{display:block;width:390px;height:3000px;border:0;margin:0 auto;background:#fff}
</style>
</head>
<body>
<iframe id="f" src="../" title="mobile preview"></iframe>
<script>
  var p=new URLSearchParams(location.search);
  var f=document.getElementById('f');
  if(p.get('p')) f.src=p.get('p');
  if(p.get('h')) f.style.height=p.get('h')+'px';
</script>
</body>
</html>
