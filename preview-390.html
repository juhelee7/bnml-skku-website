<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390px preview</title>
<style>
  body{margin:0;background:#d7dbe0;font:12px/1.4 system-ui,sans-serif;color:#334}
  .note{padding:8px 12px}
  .phone{width:390px;margin:12px auto;background:#fff;box-shadow:0 0 0 1px #b9c0c8}
  iframe{width:390px;height:420px;border:0;display:block}
  .tag{margin:16px auto 0;width:390px;font-weight:700}
</style>
</head>
<body>
<p class="note">Temporary 390 px preview harness — deleted after the check.</p>

<p class="tag">1 · light header (390px)</p>
<div class="phone"><iframe id="light" src="./"></iframe></div>

<p class="tag">2 · dark header, simulated (390px)</p>
<div class="phone"><iframe id="dark" src="./"></iframe></div>

<p class="tag">3 · researchers, research fields removed (390px)</p>
<div class="phone"><iframe id="res" src="researchers/"></iframe></div>

<script>
  // dark header simulation: Samsung Internet dark mode repaints the header dark while
  // leaving images alone, which is what this shows (the dark-mode logo variant is used).
  document.getElementById('dark').addEventListener('load', function () {
    var d = this.contentDocument, w = this.contentWindow;
    if (!d) return;
    var st = d.createElement('style');
    st.textContent = '.site-header{background:#1f1f1f!important;border-bottom-color:#333!important}'
      + '.menu-toggle{background:#2b3833!important;border-color:#3a4a43!important;color:#cfe8da!important}'
      + '.header-seal{padding-left:16px;border-left:1px solid #333}'
      + 'body{background:#141414}';
    d.head.appendChild(st);
    var img = d.querySelector('.brand img');
    if (img) img.src = 'assets/bnml-logo-dark.png';
  });
</script>
</body>
</html>
