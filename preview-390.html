<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390px preview</title>
<style>
  body{margin:0;background:#d7dbe0;font:12px/1.4 system-ui,sans-serif;color:#334}
  .note{padding:8px 12px}
  .phone{width:390px;margin:12px auto;background:#fff;box-shadow:0 0 0 1px #b9c0c8}
  iframe{width:390px;height:1500px;border:0;display:block}
</style>
</head>
<body>
<p class="note">Temporary 390 px preview harness — home page and PI page (deleted after the check).</p>
<div class="phone"><iframe id="home" src="./?v=390b"></iframe></div>
<div class="phone"><iframe id="group" src="group/?v=390b"></iframe></div>
<script>
  document.querySelectorAll('iframe').forEach(function (f) {
    f.addEventListener('load', function () {
      var d = f.contentDocument;
      if (d) { f.contentWindow.scrollTo(0, d.body.scrollHeight); }
    });
  });
</script>
</body>
</html>
