<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>390 px check</title>
<style>
  body{margin:0;padding:14px;background:#1d2321;font:13px/1.4 -apple-system,system-ui,sans-serif;color:#cfd8d4}
  p.tag{margin:0 0 8px;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#8fb7a6}
  .phone{width:390px;height:840px;overflow:hidden;border-radius:14px;background:#fff;box-shadow:0 10px 26px rgba(0,0,0,.5)}
  iframe{border:0;display:block;width:390px;height:840px}
</style>
</head>
<body>
<p class="tag" id="tag">390 px</p>
<div class="phone"><iframe id="fr" src="../" width="390" height="840"></iframe></div>
<script>
  var pages = {
    '1': {src:'../',             sel:null,           label:'home top'},
    '2': {src:'../group/',       sel:'.award-list',  label:'PI awards'},
    '3': {src:'../researchers/', sel:'.people-group:first-of-type article:nth-of-type(4)', label:'researchers: Priyannth'},
    '4': {src:'../publications/',sel:'.pub-list',    label:'publications top: 165-160'},
    '5': {src:'../news/',        sel:'.news-year',   label:'news 2026'},
    '6': {src:'../research/',    sel:'#bio-derived-materials', label:'research area 03'},
    '7': {src:'../researchers/', sel:'.people-group:last-of-type article:last-child', label:'researchers: Rashmita'},
    '8': {src:'../researchers/', sel:'.people-group:last-of-type article:nth-of-type(7)', label:'researchers: Hyunlee Kim'}
  };
  var id = (location.search.match(/p=(\d)/) || [,'1'])[1];
  var cfg = pages[id] || pages['1'];
  document.getElementById('tag').textContent = '390 px · ' + cfg.label;
  var f = document.getElementById('fr');
  f.src = cfg.src + '?v=h' + id;
  f.addEventListener('load', function(){
    if(!cfg.sel) return;
    var w = f.contentWindow, d = f.contentDocument;
    var el = d.querySelector(cfg.sel);
    if (el) w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 10);
  });
</script>
</body>
</html>
