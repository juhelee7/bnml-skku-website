<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile preview</title>
<style>
  html,body{margin:0;background:#e9edf2;font-family:-apple-system,Arial,sans-serif}
  .stage{padding:12px;display:flex;align-items:flex-start}
  .phone{width:390px;flex:none;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:14px;overflow:hidden}
  iframe{width:390px;height:3400px;border:0;display:block}
  h1{font-size:12px;color:#64748b;padding:8px 14px;margin:0;letter-spacing:.04em}
</style>
</head>
<body>
<h1 id="t">Mobile 390px preview</h1>
<div class="stage"><div class="phone"><iframe id="f" src="/bnml-skku-website/" scrolling="no" title="preview"></iframe></div></div>
<script>
  var p = new URLSearchParams(location.search).get('p') || '';
  document.getElementById('f').src = '/bnml-skku-website/' + p + '?cb=' + Date.now();
  document.getElementById('t').textContent = '390px viewport · /' + p;
</script>
</body>
</html>
