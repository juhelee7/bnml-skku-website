<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero preview — 390 px</title>
<style>
  body{margin:0;padding:16px;background:#1d2321;font:13px/1.4 -apple-system,system-ui,sans-serif;color:#cfd8d4}
  p.tag{margin:0 0 6px;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#8fb7a6}
  .phone{width:390px;height:420px;overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  iframe{border:0;display:block;width:390px;height:420px}
</style>
</head>
<body>
<p class="tag">home hero, 390 px</p>
<div class="phone"><iframe id="hero390" src="./?v=hero2" width="390" height="420"></iframe></div>

<script>
  var f = document.getElementById('hero390');
  f.addEventListener('load', function(){
    var w = f.contentWindow, d = f.contentDocument;
    var el = d.querySelector('.hero-photo');
    if (el) w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 8);
  });
</script>
</body>
</html>
